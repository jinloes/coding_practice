plugins {
    id 'java'
    id 'jacoco'
    id 'org.jetbrains.intellij.platform' version '2.19.0'
    id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'com.jinloes.coding_practice'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    exampleLibraries
}

ext {
    // Single declaration shared by this build and the generated verification script resource.
    junitBomVersion = '5.11.4'
    assertjVersion = '3.26.3'
    verificationRelease = '17'
}

dependencies {
    exampleLibraries "org.assertj:assertj-core:$assertjVersion"
    intellijPlatform {
        if (providers.gradleProperty('idePath').isPresent()) {
            local(providers.gradleProperty('idePath').get())
        } else {
            intellijIdea('2026.2.3')
        }
        bundledPlugins('com.intellij.java', 'com.intellij.gradle', 'org.jetbrains.plugins.gradle', 'JUnit',
                'com.intellij.modules.jcef')
        testFramework(org.jetbrains.intellij.platform.gradle.TestFrameworkType.Platform.INSTANCE)
    }
    testImplementation platform("org.junit:junit-bom:$junitBomVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.assertj:assertj-core:$assertjVersion"
    // The IDE fixture bootstrap references legacy TestCase; authored tests remain Jupiter.
    testRuntimeOnly('junit:junit:4.13.2') {
        transitive = false
    }
}

intellijPlatform {
    pluginConfiguration {
        name = 'Algorithm Practice'
        ideaVersion {
            sinceBuild = '262.10968.63'
            untilBuild = '262.*'
        }
        pluginVerification {
            ides {
                current()
            }
        }
    }
}

test {
    useJUnitPlatform()
    systemProperty 'practice.test.classpath', sourceSets.test.runtimeClasspath.asPath
    systemProperty 'idea.load.plugins.id', 'com.jinloes.practice'
    systemProperty 'practice.catalog.only', providers.gradleProperty('catalogOnly').getOrElse('')
    // The test IDE loads plugin classes through PathClassLoader, which JaCoCo only sees with this option.
    jacoco {
        includeNoLocationClasses = true
        excludes = ['jdk.internal.*']
    }
    finalizedBy 'jacocoTestReport'
}

jacoco {
    toolVersion = '0.8.15'
}

// Coverage is enforced on the logic packages. The ui package and the classes below need a running IDE,
// JCEF, or OS privileges that unit tests do not have; keep this list short and justify each entry in CODE-MAP.md.
def coverageExclusions = [
        'com/jinloes/practice_plugin/ui/**',
]

def coverageClasses = files(tasks.named('instrumentCode')).asFileTree.matching {
    exclude coverageExclusions
}

tasks.named('jacocoTestReport') {
    classDirectories.setFrom(coverageClasses)
    reports {
        xml.required = true
        html.required = true
    }
}

// A ratchet just below the measured baseline: raise these when coverage improves, never lower them.
// Reads the last test run's data instead of depending on test, so it can also run after test failures
// with --continue. Run it after the full suite; a partial run under-reports coverage.
def coverageVerification = tasks.named('jacocoTestCoverageVerification') {
    executionData.setFrom(layout.buildDirectory.file('jacoco/test.exec'))
    classDirectories.setFrom(coverageClasses)
    mustRunAfter 'test'
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.98
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.92
            }
        }
    }
}

tasks.named('check') {
    dependsOn coverageVerification
}

tasks.named('wrapper') {
    gradleVersion = '9.3.1'
    distributionType = Wrapper.DistributionType.BIN
}

def exampleLibrariesIndex = tasks.register('exampleLibrariesIndex') {
    def jars = configurations.exampleLibraries
    def index = layout.buildDirectory.file('example-libraries/index.txt')
    inputs.files(jars)
    outputs.file(index)
    doLast {
        def file = index.get().asFile
        file.parentFile.mkdirs()
        file.text = jars.files.collect { it.name }.sort().join('\n') + '\n'
    }
}

// The React pages in web/ build with a Gradle-managed Node, so contributors need no local Node install.
node {
    download = true
    version = '24.22.0'
    npmInstallCommand = 'ci'
    nodeProjectDir = file('web')
}

def webUi = tasks.register('webUi', com.github.gradle.node.npm.task.NpmTask) {
    description = 'Builds the React pages into one self-contained build/web/index.html.'
    dependsOn tasks.named('npmInstall')
    npmCommand = ['run', 'build']
    inputs.dir('web/src')
    inputs.files('web/index.html', 'web/package.json', 'web/package-lock.json', 'web/tsconfig.json',
            'web/vite.config.ts')
    outputs.dir(layout.buildDirectory.dir('web'))
}

tasks.named('processResources') {
    from(webUi) { into 'web' }
    from('gradlew') { into 'bootstrap' }
    from('gradlew.bat') { into 'bootstrap' }
    from('gradle/wrapper') { into 'bootstrap/gradle/wrapper' }
    from(configurations.exampleLibraries) { into 'example-libraries' }
    from(exampleLibrariesIndex) { into 'example-libraries' }
    inputs.property('junitBomVersion', junitBomVersion)
    inputs.property('assertjVersion', assertjVersion)
    inputs.property('verificationRelease', verificationRelease)
    filesMatching('gradle/verification-build.gradle') {
        filter(org.apache.tools.ant.filters.ReplaceTokens, tokens: [
                JUNIT_BOM: junitBomVersion,
                ASSERTJ  : assertjVersion,
                RELEASE  : verificationRelease
        ])
    }
}
