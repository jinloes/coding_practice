plugins {
    id 'java'
    id 'jacoco'
    alias(libs.plugins.intellij.platform)
    alias(libs.plugins.node.gradle)
}

group = 'com.jinloes.coding_practice'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    exampleLibraries
    verificationLibraries.extendsFrom(exampleLibraries)
}

sourceSets {
    verificationRunner {
        compileClasspath = configurations.verificationLibraries
    }
}

ext {
    verificationRelease = '17'
}

def idePath = providers.gradleProperty('idePath').filter { !it.isBlank() }

dependencies {
    implementation(libs.copilot.sdk) {
        exclude group: 'net.java.dev.jna'
    }
    exampleLibraries libs.assertj.core
    verificationLibraries platform(libs.junit.bom)
    verificationLibraries libs.junit.jupiter
    verificationLibraries libs.junit.platform.launcher
    verificationLibraries 'org.apiguardian:apiguardian-api:1.1.2'
    intellijPlatform {
        if (idePath.isPresent()) {
            local(idePath.get())
        } else {
            intellijIdea(libs.versions.intellij.idea.get())
        }
        bundledPlugins('com.intellij.java', 'com.intellij.modules.jcef')
        testFramework(org.jetbrains.intellij.platform.gradle.TestFrameworkType.Platform.INSTANCE)
    }
    testImplementation sourceSets.verificationRunner.output
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation libs.junit.platform.launcher
    testImplementation libs.assertj.core
    // The IDE fixture bootstrap references legacy TestCase; authored tests remain Jupiter.
    testRuntimeOnly('junit:junit:4.13.2') {
        transitive = false
    }
}

intellijPlatform {
    sandboxContainer = layout.buildDirectory.dir('sandbox')
    pluginConfiguration {
        name = 'Algorithm Practice'
        ideaVersion {
            sinceBuild = '262.10968.63'
            untilBuild = provider { null }
        }
    }
    pluginVerification {
        ides {
            current()
        }
    }
}

// Redirects winp's extracted native helpers out of Gradle 9's immutable IntelliJ SDK transform cache on Windows.
class WinpArgumentProvider implements CommandLineArgumentProvider {
    @Internal
    final Provider<Directory> winpDir

    WinpArgumentProvider(Provider<Directory> winpDir) {
        this.winpDir = winpDir
    }

    @Override
    Iterable<String> asArguments() {
        def dir = winpDir.get().asFile
        dir.mkdirs()
        return ["-Dwinp.folder.preferred=${dir.absolutePath}".toString()]
    }
}

def winpArgumentProvider = new WinpArgumentProvider(layout.buildDirectory.dir('winp'))
tasks.matching { it instanceof JavaForkOptions }.configureEach {
    jvmArgumentProviders.add(winpArgumentProvider)
}

test {
    useJUnitPlatform {
        if (providers.gradleProperty('fast').isPresent()) {
            excludeTags 'catalog', 'gradle-integration'
        }
    }
    systemProperty 'practice.test.classpath', sourceSets.test.runtimeClasspath.asPath
    systemProperty 'idea.load.plugins.id', 'com.jinloes.practice'
    systemProperty 'practice.catalog.only', providers.gradleProperty('catalogOnly').getOrElse('')
    // The test IDE loads plugin classes through PathClassLoader, which JaCoCo only sees with this option.
    jacoco {
        includeNoLocationClasses = true
        excludes = ['jdk.internal.*']
    }
    finalizedBy 'jacocoTestReport'
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

// Coverage is enforced on the logic packages. The ui package and the classes below need a running IDE,
// JCEF, or OS privileges that unit tests do not have; keep this list short and justify each entry in CODE-MAP.md.
def coverageExclusions = [
        'com/jinloes/practice_plugin/ui/**',
]

def coverageClasses = files(tasks.named('instrumentCode')).asFileTree.matching {
    exclude coverageExclusions
}

tasks.named('jacocoTestReport') {
    classDirectories.setFrom(coverageClasses)
    reports {
        xml.required = true
        html.required = true
    }
}

// A ratchet just below the measured baseline: raise these when coverage improves, never lower them.
// Reads the last test run's data instead of depending on test, so it can also run after test failures
// with --continue. Run it after the full suite; a partial run under-reports coverage.
def coverageVerification = tasks.named('jacocoTestCoverageVerification') {
    executionData.setFrom(layout.buildDirectory.file('jacoco/test.exec'))
    classDirectories.setFrom(coverageClasses)
    mustRunAfter 'test'
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 1.00
            }
            limit {
                counter = 'BRANCH'
                minimum = 1.00
            }
        }
    }
}

tasks.named('check') {
    dependsOn coverageVerification, 'webTest'
}

tasks.named('wrapper') {
    gradleVersion = '9.3.1'
    distributionType = Wrapper.DistributionType.BIN
}

def exampleLibrariesIndex = tasks.register('exampleLibrariesIndex') {
    def jars = configurations.exampleLibraries
    def index = layout.buildDirectory.file('example-libraries/index.txt')
    inputs.files(jars)
    outputs.file(index)
    doLast {
        def file = index.get().asFile
        file.parentFile.mkdirs()
        file.text = jars.files.collect { it.name }.sort().join('\n') + '\n'
    }
}

tasks.named('compileVerificationRunnerJava', JavaCompile) {
    options.release = Integer.parseInt(verificationRelease)
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:-classfile')
}

def verificationRunnerJar = tasks.register('verificationRunnerJar', Jar) {
    archiveFileName = 'verification-runner.jar'
    destinationDirectory = layout.buildDirectory.dir('verification-runner')
    from(sourceSets.verificationRunner.output)
}

def verificationOnlyJars = providers.zip(
        configurations.verificationLibraries.elements,
        configurations.exampleLibraries.elements
) { allJars, exampleJars ->
    def exampleNames = exampleJars.collect { it.asFile.name } as Set
    allJars.collect { it.asFile }.findAll { !(it.name in exampleNames) }
}

def verificationLibrariesIndex = tasks.register('verificationLibrariesIndex') {
    def runnerJar = verificationRunnerJar.flatMap { it.archiveFile }
    def index = layout.buildDirectory.file('verification-libraries/index.txt')
    inputs.files(verificationOnlyJars)
    inputs.file(runnerJar)
    outputs.file(index)
    doLast {
        def file = index.get().asFile
        file.parentFile.mkdirs()
        def names = (verificationOnlyJars.get().collect { it.name } + [runnerJar.get().asFile.name]).sort()
        file.text = names.join('\n') + '\n'
    }
}

// The React pages in web/ build with a Gradle-managed Node, so contributors need no local Node install.
node {
    download = true
    version = '24.22.0'
    npmInstallCommand = 'ci'
    nodeProjectDir = file('web')
}

def webTest = tasks.register('webTest', com.github.gradle.node.npm.task.NpmTask) {
    description = 'Runs the Vitest unit suite for the React pages.'
    dependsOn tasks.named('npmInstall')
    npmCommand = ['run', 'test']
    inputs.dir('web/src')
    inputs.files('web/package.json', 'web/package-lock.json', 'web/tsconfig.json', 'web/vitest.config.ts')
    outputs.upToDateWhen { true }
}

def webUi = tasks.register('webUi', com.github.gradle.node.npm.task.NpmTask) {
    description = 'Builds the React pages into one self-contained build/web/index.html.'
    dependsOn tasks.named('npmInstall')
    npmCommand = ['run', 'build']
    inputs.dir('web/src')
    inputs.files('web/index.html', 'web/package.json', 'web/package-lock.json', 'web/tsconfig.json',
            'web/vite.config.ts')
    outputs.dir(layout.buildDirectory.dir('web'))
}

tasks.named('processResources') {
    from(webUi) { into 'web' }
    from(configurations.exampleLibraries) { into 'example-libraries' }
    from(exampleLibrariesIndex) { into 'example-libraries' }
    from(verificationOnlyJars) { into 'verification-libraries' }
    from(verificationRunnerJar) { into 'verification-libraries' }
    from(verificationLibrariesIndex) { into 'verification-libraries' }
}

// LegacyWorkspaceFixture reproduces the historical Gradle workspace layout in tests only.
tasks.named('processTestResources') {
    from('gradlew') { into 'bootstrap' }
    from('gradlew.bat') { into 'bootstrap' }
    from('gradle/wrapper') { into 'bootstrap/gradle/wrapper' }
}

apply from: 'gradle/local-sandbox.gradle'
