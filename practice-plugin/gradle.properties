# Set idePath to launch the sandbox against a locally installed IDE instead of
# downloading the pinned SDK. Uncomment and point it at your installation, or
# set the same property in ~/.gradle/gradle.properties to keep it off the repo.
#
#   macOS:   idePath=/Applications/IntelliJ IDEA.app
#   Linux:   idePath=/opt/idea
#   Windows: idePath=C:/Program Files/JetBrains/IntelliJ IDEA
#
# idePath=
