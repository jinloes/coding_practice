import com.github.gradle.node.npm.task.NpmInstallTask
import com.github.gradle.node.npm.task.NpmTask

plugins {
    id 'java'
    id 'jacoco'
    id 'org.jetbrains.intellij.platform' version '2.19.0'
    id 'com.github.node-gradle.node' version '7.1.0'
}

group = 'com.jinloes.coding_practice'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def idePath = providers.gradleProperty('idePath').filter { !it.isBlank() }

dependencies {
    intellijPlatform {
        if (idePath.isPresent()) {
            local(idePath.get())
        } else {
            intellijIdea('2026.2.3')
        }
        bundledPlugins('com.intellij.modules.jcef')
    }
    // Lists the account's models for the settings dialog. JNA serves only the SDK's in-process mode, which an
    // explicit cliPath never selects, and the IDE loads its own JNA native library.
    implementation('com.github:copilot-sdk-java:1.0.28') {
        exclude group: 'net.java.dev.jna'
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.26.3'
}

intellijPlatform {
    sandboxContainer = layout.buildDirectory.dir('sandbox')
    // The plugin registers no IDE Settings configurables, so building searchable options would boot a headless IDE for an empty index.
    buildSearchableOptions = false
    pluginConfiguration {
        ideaVersion {
            sinceBuild = '262.10968.63'
            untilBuild = provider { null }
        }
    }
    pluginVerification {
        ides {
            current()
        }
    }
}

// Redirects winp's extracted native helpers out of Gradle 9's immutable IntelliJ SDK transform cache on Windows.
class WinpArgumentProvider implements CommandLineArgumentProvider {
    @Internal
    final Provider<Directory> winpDir

    WinpArgumentProvider(Provider<Directory> winpDir) {
        this.winpDir = winpDir
    }

    @Override
    Iterable<String> asArguments() {
        def dir = winpDir.get().asFile
        dir.mkdirs()
        return ["-Dwinp.folder.preferred=${dir.absolutePath}".toString()]
    }
}

// Passes test paths via CommandLineArgumentProvider with relative/classpath input normalization so :test stays
// configuration-cacheable and relocatable in the Gradle build cache.
class DesignTestArgumentProvider implements CommandLineArgumentProvider {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    final Directory problemsDir

    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    final Directory tracksDir

    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    final Directory guidesDir

    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    final RegularFile webSample

    @Classpath
    final FileCollection fakeCliClasspath

    @Internal
    final Provider<Directory> webBuildDir

    DesignTestArgumentProvider(
            Directory problemsDir,
            Directory tracksDir,
            Directory guidesDir,
            RegularFile webSample,
            FileCollection fakeCliClasspath,
            Provider<Directory> webBuildDir) {
        this.problemsDir = problemsDir
        this.tracksDir = tracksDir
        this.guidesDir = guidesDir
        this.webSample = webSample
        this.fakeCliClasspath = fakeCliClasspath
        this.webBuildDir = webBuildDir
    }

    @Override
    Iterable<String> asArguments() {
        return [
                // Lets the catalog tests compare manifest files with the index lists.
                "-Ddesign.problems.dir=${problemsDir.asFile.absolutePath}".toString(),
                "-Ddesign.tracks.dir=${tracksDir.asFile.absolutePath}".toString(),
                "-Ddesign.guides.dir=${guidesDir.asFile.absolutePath}".toString(),
                "-Ddesign.web.sample=${webSample.asFile.absolutePath}".toString(),
                // Excludes the IDE distribution so -Ddesign.test.classpath stays well below the Windows command-line limit.
                "-Ddesign.test.classpath=${fakeCliClasspath.asPath}".toString(),
                "-Ddesign.web.build.dir=${webBuildDir.get().asFile.absolutePath}".toString(),
        ]
    }
}

def webBuildDir = layout.buildDirectory.dir('web')
def winpArgumentProvider = new WinpArgumentProvider(layout.buildDirectory.dir('winp'))
tasks.withType(JavaExec).configureEach {
    jvmArgumentProviders.add(winpArgumentProvider)
}

tasks.named('test', Test) {
    useJUnitPlatform()
    jvmArgumentProviders.add(winpArgumentProvider)
    jvmArgumentProviders.add(new DesignTestArgumentProvider(
            layout.projectDirectory.dir('src/main/resources/problems'),
            layout.projectDirectory.dir('src/main/resources/tracks'),
            layout.projectDirectory.dir('src/main/resources/guides'),
            layout.projectDirectory.file('web/src/sample.ts'),
            sourceSets.test.output.classesDirs + configurations.runtimeClasspath,
            webBuildDir))
    // The test IDE loads plugin classes through PathClassLoader, which JaCoCo only sees with this option.
    jacoco {
        includeNoLocationClasses = true
        excludes = ['jdk.internal.*']
    }
    finalizedBy 'jacocoTestReport'
}

jacoco {
    toolVersion = '0.8.15'
}

// Coverage is enforced on the logic packages. The ui package needs a running IDE and JCEF;
// keep logic out of it and justify any further exclusion in CODE-MAP.md.
def coverageExclusions = [
        'com/jinloes/system_design_plugin/ui/**',
]

def coverageClasses = files(tasks.named('instrumentCode')).asFileTree.matching {
    exclude coverageExclusions
}

tasks.withType(JacocoReportBase).configureEach {
    classDirectories.setFrom(coverageClasses)
}

tasks.named('jacocoTestReport', JacocoReport) {
    reports {
        xml.required = true
        html.required = true
    }
}

def coverageVerification = tasks.named('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    executionData.setFrom(layout.buildDirectory.file('jacoco/test.exec'))
    mustRunAfter 'test'
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 1.00
            }
            limit {
                counter = 'BRANCH'
                minimum = 1.00
            }
        }
    }
}

def webTest = tasks.register('webTest', NpmTask) {
    description = 'Runs the Vitest unit suite for the tool window and editor state tracker.'
    dependsOn tasks.named('npmInstall')
    npmCommand = ['run', 'test']
    inputs.dir(layout.projectDirectory.dir('web/src'))
            .withPropertyName('webSrc')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(layout.projectDirectory.files(
            'web/package.json', 'web/package-lock.json', 'web/tsconfig.json', 'web/vitest.config.ts'))
            .withPropertyName('webTestConfig')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    def stampFile = layout.buildDirectory.file('test-results/webTest/passed.txt')
    outputs.file(stampFile).withPropertyName('stampFile')
    outputs.cacheIf { true }
    doLast {
        def target = stampFile.get().asFile
        target.parentFile.mkdirs()
        target.setText('ok\n', 'UTF-8')
    }
}

tasks.named('check') {
    dependsOn coverageVerification, webTest
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '9.3.1'
    distributionType = Wrapper.DistributionType.BIN
}

// The web pages build with a Gradle-managed Node, so contributors need no local Node install.
node {
    download = true
    version = '24.22.0'
    npmInstallCommand = 'ci'
    fastNpmInstall = true
    enableTaskRules = false
    nodeProjectDir = layout.projectDirectory.dir('web')
}

tasks.named('npmInstall', NpmInstallTask) {
    args.addAll('--no-audit', '--no-fund', '--prefer-offline')
}

def webUi = tasks.register('webUi', NpmTask) {
    description = 'Builds the tool window and Excalidraw editor pages into build/web.'
    dependsOn tasks.named('npmInstall')
    npmCommand = ['run', 'build']
    inputs.dir(layout.projectDirectory.dir('web/src'))
            .withPropertyName('webSrc')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir(layout.projectDirectory.dir('web/scripts'))
            .withPropertyName('webScripts')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.files(layout.projectDirectory.files(
            'web/index.html', 'web/editor.html', 'web/vite.config.ts', 'web/tsconfig.json',
            'web/package.json', 'web/package-lock.json'))
            .withPropertyName('webConfig')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.dir(webBuildDir).withPropertyName('webBuildDir')
    outputs.cacheIf { true }
}

tasks.named('processResources', ProcessResources) {
    from(webUi) { into 'web' }
}

apply from: 'gradle/local-sandbox.gradle'
