name: Practice Plugin

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'practice-plugin/**'
      - 'plugin-common/**'
      - 'gradle/libs.versions.toml'
      - 'gradle/local-sandbox.gradle'
      - '.github/workflows/practice-plugin.yml'
  pull_request:
    paths:
      - 'practice-plugin/**'
      - 'plugin-common/**'
      - 'gradle/libs.versions.toml'
      - 'gradle/local-sandbox.gradle'
      - '.github/workflows/practice-plugin.yml'

permissions:
  contents: read

concurrency:
  group: practice-plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            gradle/libs.versions.toml
            plugin-common/build.gradle
            practice-plugin/build.gradle
            practice-plugin/gradle.properties
            practice-plugin/gradle/wrapper/gradle-wrapper.properties

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-practice-plugin-npm-${{ hashFiles('practice-plugin/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-practice-plugin-npm-

      - name: Cache Gradle-managed Node.js
        uses: actions/cache@v4
        with:
          path: practice-plugin/.gradle/nodejs
          key: ${{ runner.os }}-practice-plugin-node-${{ hashFiles('practice-plugin/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-practice-plugin-node-

      - name: Validate catalog manifests and tracks statically
        run: python3 practice-plugin/scripts/catalog_tool.py validate

      - name: Select catalog exercises to execute
        id: catalog
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          BASE_IDS="pair-sum,binary-search,merge-sorted-lists"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            DIFF_RANGE="$BASE_SHA...$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            DIFF_RANGE="$BEFORE_SHA...$HEAD_SHA"
          else
            DIFF_RANGE="HEAD~1...HEAD"
          fi
          CHANGED=$(git diff --diff-filter=ACMR --name-only "$DIFF_RANGE" 2>/dev/null \
            | sed -n -E 's#^practice-plugin/src/(main/resources/exercises|test/resources/(reference|known-wrong))/([^/]+)/.*#\3#p' || true)
          filter_existing() {
            while IFS= read -r id; do
              if [ -n "$id" ] && [ -f "practice-plugin/src/main/resources/exercises/$id/exercise.json" ]; then
                printf '%s\n' "$id"
              fi
            done
          }
          ONLY=$({ printf '%s\n' "$BASE_IDS" | tr ',' '\n'; printf '%s\n' "$CHANGED"; } \
            | sort -u | filter_existing | paste -sd, - || true)
          if [ -z "$ONLY" ] && [ -f "practice-plugin/src/main/resources/exercises/index.txt" ]; then
            ONLY=$(tr -d '\r' < "practice-plugin/src/main/resources/exercises/index.txt" \
              | filter_existing | sed -n '1,3p' | paste -sd, - || true)
          fi
          echo "only=$ONLY" >> "$GITHUB_OUTPUT"

      - name: Run plugin-common and plugin checks, frontend tests, coverage gate, and distribution build
        working-directory: practice-plugin
        env:
          CATALOG_ONLY: ${{ steps.catalog.outputs.only }}
        run: |
          bash ./gradlew :plugin-common:check check buildPlugin -PcatalogOnly="$CATALOG_ONLY" --no-daemon --console=plain
          test -f build/distributions/practice-plugin-1.0-SNAPSHOT.zip
