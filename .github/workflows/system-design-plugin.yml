name: System Design Plugin

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'system-design-plugin/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/system-design-plugin.yml'
  pull_request:
    paths:
      - 'system-design-plugin/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/system-design-plugin.yml'

permissions:
  contents: read

concurrency:
  group: system-design-plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            gradle/libs.versions.toml
            system-design-plugin/build.gradle
            system-design-plugin/gradle.properties
            system-design-plugin/gradle/wrapper/gradle-wrapper.properties

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-system-design-plugin-npm-${{ hashFiles('system-design-plugin/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-system-design-plugin-npm-

      - name: Cache Gradle-managed Node.js
        uses: actions/cache@v4
        with:
          path: system-design-plugin/.gradle/nodejs
          key: ${{ runner.os }}-system-design-plugin-node-${{ hashFiles('system-design-plugin/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-system-design-plugin-node-

      - name: Run plugin checks, coverage gate, and distribution build
        working-directory: system-design-plugin
        run: |
          bash ./gradlew check buildPlugin verifyPluginProjectConfiguration verifyPluginStructure --no-daemon --console=plain
          test -f build/distributions/system-design-plugin-1.0-SNAPSHOT.zip
