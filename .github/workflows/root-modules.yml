name: Root Modules

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'concurrency/**'
      - 'cryptography/**'
      - 'reflection/**'
      - 'regex/**'
      - 'system-design/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/root-modules.yml'
  pull_request:
    paths:
      - 'concurrency/**'
      - 'cryptography/**'
      - 'reflection/**'
      - 'regex/**'
      - 'system-design/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/root-modules.yml'

permissions:
  contents: read

concurrency:
  group: root-modules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            build.gradle
            settings.gradle
            gradle/libs.versions.toml
            */build.gradle
            gradle/wrapper/gradle-wrapper.properties

      - name: Ensure native PCRE2
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpcre2-8-0

      - name: Run root-module checks through the composite wrapper
        run: bash ./gradlew :concurrency:check :cryptography:check :reflection:check :regex:check :system-design:check --no-daemon --console=plain
