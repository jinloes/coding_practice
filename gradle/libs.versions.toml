[versions]
assertj = "3.26.3"
copilot-sdk = "2.0.1"
intellij-idea = "2026.2.3"
intellij-platform = "2.19.0"
jacoco = "0.8.15"
junit-bom = "5.11.4"
node = "24.22.0"
node-gradle = "7.1.0"

[libraries]
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
copilot-sdk = { module = "com.microsoft:copilot-sdk", version.ref = "copilot-sdk" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }
node-gradle = { id = "com.github.node-gradle.node", version.ref = "node-gradle" }
